<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Surface Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="70%" stop-color="#0C0A09" />
      <stop offset="100%" stop-color="#050504" />
    </radialGradient>

    <!-- Celestial Gold Luxury Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="25%" stop-color="#F3DC9B" />
      <stop offset="60%" stop-color="#D4A853" />
      <stop offset="85%" stop-color="#B07D2F" />
      <stop offset="100%" stop-color="#6E440E" />
    </linearGradient>

    <!-- Secondary Gold Shimmer -->
    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8B3" />
      <stop offset="50%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#8C5D1E" />
    </linearGradient>

    <!-- Azure / Cyan Companion Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Floating Glyph -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#D4A853" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Sanctuary Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Fine Golden Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#D4A853" stroke-width="1" stroke-opacity="0.15" />

  <!-- Ambient Glow Behind Core Beacon -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" />

  <!-- Geometric Celestial Diamond Halo -->
  <g transform="translate(256, 256)" filter="url(#ambientShadow)">
    <!-- Outer 8-Point Compass Rings -->
    <polygon points="0,-190 24,-130 84,-84 130,-24 190,0 130,24 84,84 24,130 0,190 -24,130 -84,84 -130,24 -190,0 -130,-24 -84,-84 -24,-130" 
             fill="none" stroke="url(#goldAccent)" stroke-width="2" stroke-opacity="0.4" />

    <!-- Rotated Concentric Star Lattice -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="96" fill="#14110F" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

    <!-- ─── ICONIC 'N' CELESTIAL BEACON GLYPH ─── -->
    <g filter="url(#goldGlow)">
      <!-- Left Vertical Pillar -->
      <path d="M-64,-72 L-36,-72 L-36,72 L-64,72 Z" fill="url(#goldGrad)" />
      <!-- Left Pillar Bevel Accent -->
      <path d="M-64,-72 L-50,-72 L-50,72 L-64,72 Z" fill="#FFF8E7" opacity="0.6" />

      <!-- Diagonal Nexus Bridge -->
      <path d="M-42,-72 L-10,-72 L44,72 L12,72 Z" fill="url(#goldAccent)" />
      <!-- Diagonal Highlight Blade -->
      <path d="M-28,-72 L-14,-72 L36,72 L22,72 Z" fill="#FFFDF8" opacity="0.75" />

      <!-- Right Vertical Pillar -->
      <path d="M36,-72 L64,-72 L64,72 L36,72 Z" fill="url(#goldGrad)" />
      <!-- Right Pillar Shadow Bevel -->
      <path d="M50,-72 L64,-72 L64,72 L50,72 Z" fill="#6E440E" opacity="0.5" />
    </g>

    <!-- Central Floating Neural Core Spark -->
    <circle cx="0" cy="0" r="14" fill="#38BDF8" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Micro Orbital Satellites -->
    <circle cx="0" cy="-38" r="3" fill="#D4A853" />
    <circle cx="0" cy="38" r="3" fill="#D4A853" />
    <circle cx="-38" cy="0" r="3" fill="#D4A853" />
    <circle cx="38" cy="0" r="3" fill="#D4A853" />
  </g>
</svg>
